<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thumbtack Industries</title>
<link rel="icon" type="image/svg+xml" href="Icon">

<style>
:root{--bg:#fff;--ink:#000;--mut:#444;--ln:#999;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "Times New Roman",Times,serif}
#con{background:#000;color:#fff;font:13px/1.45 "Courier New",monospace;height:116px;margin:10px;cursor:text;transition:height .12s;padding:8px;display:flex;flex-direction:column;position:relative}
#log{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#con.open{height:144px}
#cmd{position:relative;display:none;gap:6px;align-items:center;border-top:1px solid #333;padding-top:4px;margin-top:4px}
#con.open #cmd{display:flex}
#sug{display:none;position:absolute;left:0;right:0;bottom:100%;margin-bottom:3px;background:#111;border:1px solid #555;max-height:92px;overflow-y:auto;z-index:5}
#sug.on{display:block}
.si{display:flex;justify-content:space-between;gap:12px;padding:1px 8px;cursor:pointer;font-size:13px}
.si span{color:#888;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si.sel{background:#2d2d2d}.si.hint{cursor:default;color:#999}
#ci{flex:1;min-width:0;background:transparent;color:#fff;border:0;font:13px "Courier New",monospace;padding:0;outline:0}
#tb{background:#222;color:#bbb;border:1px solid #444;font:11px "Courier New",monospace;padding:1px 6px;cursor:pointer}
#ci:focus-visible{outline:1px solid #888}#ci::placeholder{color:#777}
#con div{white-space:pre-wrap}
#con{border:1px solid #3a3a3a;box-shadow:0 0 0 1px #000,0 0 14px rgba(255,255,255,.08),inset 0 0 36px rgba(255,255,255,.05);color:#ececec}
#con::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#con::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);animation:flick 5s infinite}
#log div{text-shadow:0 0 5px rgba(255,255,255,.55)}
.nl{animation:rev .55s steps(36,end)}
.cur{display:inline-block;width:.6em;height:1em;background:#fff;vertical-align:-2px;margin-left:3px;box-shadow:0 0 6px rgba(255,255,255,.8);animation:blink 1.05s steps(1) infinite}
#con.open .cur{display:none}
.ps{color:#9a9a9a;white-space:nowrap;text-shadow:0 0 4px rgba(255,255,255,.35)}
#ci{text-shadow:0 0 5px rgba(255,255,255,.5);caret-color:#fff}
#sug{font-family:"Courier New",monospace;box-shadow:0 0 12px rgba(255,255,255,.12)}
#con ::selection{background:#fff;color:#000}
@keyframes rev{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}46%{opacity:.85}48%{opacity:1}74%{opacity:.9}76%{opacity:1}}
@media (prefers-reduced-motion:reduce){.nl,.cur,#con::after{animation:none}}
.w{padding:0 10px;max-width:355px}
#cols{display:flex;flex-flow:column wrap;align-content:flex-start;column-gap:28px;padding:0 10px;overflow-x:auto;overflow-y:hidden;height:420px}
#cols section{width:335px;max-width:100%}
h1{font-size:24px;margin:10px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
h2{font-size:16px;margin:18px 0 4px;border-bottom:1px solid var(--ln)}
#rbox,#abox{margin:10px 0 0 6px;padding-left:10px;border-left:2px solid var(--ink)}
#rbox h2.sub,#abox h2.sub{font-size:13px;margin:0 0 4px;border:0}
:root[data-theme="dark"]{--bg:#181818;--ink:#e8e8e8;--mut:#b4b4b4;--ln:#555;color-scheme:dark}
:root[data-theme="dark"] button:not(.ib):not(.rc){background:linear-gradient(to bottom,#5a5a5a 0%,#464646 50%,#333 100%);color:#f2f2f2;border-color:#8a8a8a;text-shadow:0 1px 0 rgba(0,0,0,.5)}
:root[data-theme="dark"] button:not(.ib):not(.rc):hover:not(:disabled){background:linear-gradient(to bottom,#686868 0%,#525252 50%,#3c3c3c 100%);border-color:#b0b0b0}
:root[data-theme="dark"] button:not(.ib):not(.rc):active:not(:disabled){background:linear-gradient(to bottom,#2a2a2a,#3b3b3b);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
:root[data-theme="dark"] button:not(.ib):not(.rc):disabled{background:linear-gradient(to bottom,#2e2e2e,#282828);color:#7a7a7a;border-color:#444;text-shadow:none}
:root button.sel:not(.ib):not(.rc){background:var(--ink);color:var(--bg);border-color:var(--ink);text-shadow:none}
:root[data-theme="dark"] #fsvg svg,:root[data-theme="dark"] #mg svg{filter:invert(1)}
.rc{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;margin:5px 0;padding:4px 7px;border:1px solid var(--ink);border-radius:4px;background:linear-gradient(to bottom,#e9e9e9 0%,#dddddd 55%,#cbcbcb 100%);color:var(--ink);font:12px Arial,sans-serif;cursor:pointer}
.rc small{grid-column:1/3;color:var(--mut);font-size:11px}
.rc:disabled{opacity:.55;cursor:default;border-color:var(--ln);color:var(--ink);background:linear-gradient(to bottom,#e8e8e8,#dfdfdf)}
.rc:not(:disabled):hover{background:var(--ink);color:var(--bg)}.rc:not(:disabled):hover small{color:var(--bg)}
#itbox,#fbox,#gbox,#pbox,#sbox{border:2px solid var(--ink);padding:3px 8px;margin:6px 0 10px}
.itn b{font-size:20px}.itn span{color:var(--mut);font-size:13px}
#itbox .bar{height:6px;margin:3px 0}
#abp{display:none;border:1px solid var(--ink);padding:6px 8px;margin-top:6px}.ar{margin:5px 0;font-size:14px}.ar button{min-width:24px}
.rc.on{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .rc{background:linear-gradient(to bottom,#505050 0%,#404040 55%,#323232 100%);border-color:#aaa;color:#eee}
:root[data-theme="dark"] .rc:disabled{background:linear-gradient(to bottom,#2e2e2e,#282828)}
:root[data-theme="dark"] .rc:not(:disabled):hover,:root[data-theme="dark"] .rc.on{background:var(--ink);color:var(--bg)}
#ckb input[type=range]{width:100%}#ckb textarea{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}.rc.on small{color:var(--bg)}
#sginfo,#qinfo{display:none;border:1px solid var(--ink);padding:6px 8px;margin:6px 0;font-size:12px;line-height:1.45;max-height:300px;overflow-y:auto}#sginfo.on,#qinfo.on{display:block}
.ib{width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:italic bold 12px Georgia,serif;line-height:1;margin-left:8px;vertical-align:1px;cursor:pointer}
.ib.big{width:24px;height:24px;font-size:14px;margin-left:12px;vertical-align:4px;font-style:normal}
#sx{font-size:10px;letter-spacing:-.5px;margin-left:6px}#st{margin-left:6px}
.ib:hover,.ib.on{background:var(--ink);color:var(--bg)}
.qc{display:inline-block;width:16px;height:24px;line-height:24px;text-align:center;border:1px solid var(--ink);font:12px "Courier New",monospace;margin:0 2px 4px 0;background:var(--bg);color:var(--ink)}
.qc.off{border-color:var(--ln);color:var(--ln)}
#qreg{margin:8px 0 4px}
#qreg.go .qc:not(.off){animation:qcol .8s ease-out}
@keyframes qcol{0%{background:var(--ink);color:var(--bg)}100%{background:var(--bg);color:var(--ink)}}
#qhw{background:var(--bg);color:var(--ink);font:12px/1.55 "Courier New",monospace;padding:6px 8px;margin:6px 0 10px;border:1px solid var(--ln);white-space:pre;overflow-x:auto}
@media (prefers-reduced-motion:reduce){#qreg.go .qc{animation:none}}
#ckm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}#ckm.on{display:flex}
#ckb{background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:14px 16px;max-width:430px;width:100%;max-height:90vh;overflow:auto;font-size:13px}
#ckb h3{margin:0 0 8px;font-size:16px}#ckb pre{margin:6px 0;padding:6px 8px;border:1px solid var(--ln);font:12px/1.5 "Courier New",monospace;white-space:pre-wrap}
#ckb textarea{width:100%;box-sizing:border-box;font:11px "Courier New",monospace;margin:8px 0 4px}#ckb .g{margin:8px 0}
#sgmenu{display:none;border-left:2px solid var(--ink);margin:0 0 8px 6px;padding-left:8px}#sgmenu.on{display:block}
.info{display:none;border:1px solid var(--ink);padding:6px 8px;margin:6px 0;font-size:12px;line-height:1.45;max-height:300px;overflow-y:auto}.info.on{display:block}
.pm{border-collapse:collapse;font-size:12px;margin:6px 0}.pm td{border:1px solid var(--ink);padding:2px 7px;text-align:center}
.more{font-size:12px;color:var(--mut);margin:4px 0}
section{display:none}section.on{display:block}
.g{margin:10px 0}
button{font:13px Arial,sans-serif;cursor:pointer}button:disabled{cursor:default}
button:not(.ib):not(.rc){background:linear-gradient(to bottom,#e3e3e3 0%,#d0d0d0 50%,#b8b8b8 100%);color:#111;border:1px solid #666;border-radius:4px;padding:2px 9px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
button:not(.ib):not(.rc):hover:not(:disabled){background:linear-gradient(to bottom,#ebebeb 0%,#d9d9d9 50%,#c2c2c2 100%);border-color:#4d4d4d}
button:not(.ib):not(.rc):active:not(:disabled){background:linear-gradient(to bottom,#a6a6a6,#bebebe);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
button:not(.ib):not(.rc):disabled{background:linear-gradient(to bottom,#e7e7e7,#dedede);color:#7a7a7a;border-color:#bcbcbc;text-shadow:none}
.bar{height:8px;border:1px solid var(--ln);margin:4px 0}.bar i{display:block;height:100%;background:var(--ink)}
.lock{border:1px dashed var(--ln);padding:8px;margin:8px 0;font-size:14px}
.ok{color:var(--mut)}
</style></head><body>
<div id="app"><div id="con"><div id="log" aria-live="polite"></div><div id="cmd"><div id="sug" role="listbox"></div><span class="ps">tacks:~$</span><input id="ci" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Console command" placeholder="type a command"></div></div>
<div class="w">
<h1>Thumbtacks: <span id="hLife">0</span><button id="mu" class="ib big" aria-pressed="false" aria-label="Toggle background music" title="Music starts on your first click">&#9834;</button><button id="sx" class="ib big" aria-pressed="true" aria-label="Toggle sound effects" title="Sound effects on">fx</button><button id="st" class="ib big" aria-label="Settings" title="Settings">&#9881;</button></h1></div>
<div id="cols">

<section id="p_workbench"></section><section id="p_sales"></section><section id="p_materials"></section><section id="p_manufacturing"></section><section id="p_factory"></section><section id="p_floor"></section><section id="p_computing"></section><section id="p_research"></section><section id="p_quantum"></section><section id="p_market"></section><section id="p_strategy"></section>
</div></div>
<div id="ckm"><div id="ckb"></div></div>
